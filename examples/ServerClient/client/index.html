<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenSCAD 服务端渲染 Demo</title>

<!-- CodeMirror editor (本地 vendor，离线可用) -->
<link rel="stylesheet" href="/vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="/vendor/codemirror/material-darker.css">

<!-- Our styles -->
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ── Toolbar ────────────────────────────────────────────────── -->
<header id="toolbar">
  <span class="logo">🔷 OpenSCAD 服务端渲染</span>
  <span class="badge">服务端计算 · 浏览器仅预览</span>

  <div class="toolbar-actions">
    <select id="export-format">
      <option value="stl">STL 网格</option>
      <option value="3mf">3MF</option>
      <option value="off">OFF</option>
      <option value="amf">AMF</option>
      <option value="svg">SVG (2D)</option>
      <option value="dxf">DXF (2D)</option>
      <option value="png">PNG 图片</option>
      <option value="csg">CSG 调试</option>
      <option value="ast">AST 调试</option>
    </select>

    <button id="btn-preview" class="btn btn-primary">▶ 3D 预览</button>
    <button id="btn-png" class="btn btn-default">🖼 PNG</button>
    <button id="btn-filament" class="btn btn-filament hidden">🎨 配置耗材</button>
    <button id="btn-export" class="btn btn-export">⬇ 导出</button>

    <span id="status" class="status-idle">● 就绪</span>
    <span id="concurrency"></span>
  </div>
</header>

<!-- ── Main layout ──────────────────────────────────────────────── -->
<main id="main">
  <!-- SCAD Editor -->
  <section id="editor-panel" class="panel">
    <div class="panel-header">
      <span>📝 SCAD 脚本编辑器</span>
      <div class="panel-header-actions">
        <button id="btn-example-basic" class="btn-sm">盒体</button>
        <button id="btn-example-gear" class="btn-sm">齿轮</button>
        <button id="btn-example-text" class="btn-sm">文字</button>
        <button id="btn-example-csg" class="btn-sm">CSG 组合</button>
        <button id="btn-example-customizer" class="btn-sm">参数化</button>
        <button id="btn-example-vase" class="btn-sm">花瓶</button>
      </div>
    </div>
    <div id="editor-container"></div>
    <!-- Parameter panel (hidden when no parameters detected) -->
    <div id="param-panel" class="hidden">
      <div class="param-panel-header">
        ⚙ 参数
        <button id="btn-reset-params" class="btn-sm">↺ 重置全部</button>
      </div>
      <div id="param-list"></div>
    </div>
    <div class="panel-footer">
      <span id="error-msg" class="hidden"></span>
    </div>
  </section>

  <!-- Preview area -->
  <section id="preview-panel" class="panel">
    <div class="panel-header">
      <span>👁 3D 预览</span>
      <span class="panel-header-hint">SCAD 脚本发往服务端执行，浏览器不运行脚本</span>
    </div>
    <div id="viewer-container">
      <div id="viewer-placeholder">
        <div class="placeholder-icon">📐</div>
        <p>点击 <strong>3D 预览</strong> 将 SCAD 脚本发送到服务端渲染</p>
        <p class="hint">Ctrl+Enter 快捷渲染 · 浏览器端仅做 3D 显示</p>
      </div>
      <div id="loading">
        <div class="spinner"></div>
      </div>
      <div id="legend"></div>
      <div id="info"></div>
    </div>
    <!-- PNG overlay -->
    <div id="png-overlay">
      <div id="png-overlay-header">
        🖼 PNG 渲染结果
        <button id="btn-close-png" class="btn-sm">✕ 关闭</button>
      </div>
      <img id="png-result" alt="PNG 预览">
    </div>

    <!-- Filament Config Modal (3MF 导出耗材配置) -->
    <div id="filament-modal-overlay">
      <div id="filament-modal">
        <h3>🎨 配置耗材（3MF v4 导出）</h3>
        <div class="filament-desc">
          每个模型颜色对应一个挤出机。调整顺序可改变挤出顺序；
          名称写入 3MF 供切片软件识别（OrcaSlicer/BambuStudio paint_color MMU 分割）。
        </div>
        <div id="filament-rows"></div>
        <div class="filament-modal-footer">
          <button class="btn btn-default" id="btn-filament-reset">↺ 重置</button>
          <button class="btn btn-default" id="btn-filament-cancel">取消</button>
          <button class="btn btn-export" id="btn-filament-save">保存</button>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- ── Dependencies (本地 vendor，离线可用) ─────────────────────────── -->
<script src="/vendor/codemirror/codemirror.js"></script>
<script src="/vendor/codemirror/clike.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/three.module.js",
    "three/addons/": "/vendor/three/"
  }
}
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
