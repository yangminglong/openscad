<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoxMaker — 参数化收纳盒生成器</title>
<script src="lib/fabric.min.js"></script>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/codemirror/codemirror.min.js"></script>
<script src="lib/codemirror/clike.min.js"></script>
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="lib/codemirror/codemirror.min.css">
<link rel="stylesheet" href="lib/codemirror/material-darker.min.css">
</head>
<body>

<!-- Top Toolbar -->
<header id="toolbar">
  <h1>BoxMaker</h1>
  <span class="spacer"></span>
  <button id="btn-import-photo" class="btn" title="导入照片, 透视矫正后作为描线草图">📷 导入草图</button>
  <button id="btn-calib-sheet" class="btn" title="生成 A4 标定纸 (300dpi), 打印后把物体放上去拍照">标定纸</button>
  <input type="file" id="file-photo" accept="image/*" style="display:none">
  <label class="toggle-label"><input type="checkbox" id="chk-autopreview" checked> 自动预览</label>
  <button id="btn-reset" class="btn">重置</button>
  <select id="sel-format" class="btn">
    <option value="stl">STL</option>
    <option value="3mf">3MF</option>
  </select>
  <button id="btn-export" class="btn primary" disabled>导出</button>
  <button id="btn-settings" class="btn" title="应用设置">⚙ 设置</button>
</header>

<!-- 应用设置弹窗 (点击 ⚙设置 打开) -->
<div id="settings-pop" class="settings-pop" style="display:none">
  <div class="sp-title">应用设置</div>
  <label class="sp-item">
    <input type="radio" name="outline-mode" value="original">
    <span class="sp-name">原始轮廓模式</span>
    <span class="sp-desc">图形直接转为轮廓，拉伸为实心模型；需主动构建嵌套轮廓（孔/岛）才能输出墙模型</span>
  </label>
  <label class="sp-item">
    <input type="radio" name="outline-mode" value="wall">
    <span class="sp-name">墙模式</span>
    <span class="sp-desc">为图形创建偏置轮廓（壁厚向内），基于原始轮廓+偏置轮廓拉伸墙模型</span>
  </label>
  <div class="sp-sub">墙模式</div>
  <div class="sp-item">
    <span class="sp-name">轮廓偏置方向</span>
    <div class="sp-radios">
      <label><input type="radio" name="offset-dir" value="inner"> 内偏置</label>
      <label><input type="radio" name="offset-dir" value="outer"> 外偏置</label>
      <label><input type="radio" name="offset-dir" value="both"> 两侧偏置</label>
    </div>
  </div>
  <label class="sp-item">
    <span class="sp-name">默认壁厚（偏置距离）</span>
    <input id="sp-wall" type="number" min="0.2" step="0.2" value="2"> mm
    <span class="sp-desc">墙模式图形的壁厚初始值，创建图形时生效</span>
  </label>
  <label class="sp-item">
    <span class="sp-name">默认拉伸高度</span>
    <input id="sp-height" type="number" min="1" step="0.5" value="43.2"> mm
    <span class="sp-desc">每个图形拉伸高度的初始值，创建图形时生效（任意轮廓模式）</span>
  </label>
  <div class="sp-sub">底板</div>
  <div class="sp-item">
    <span class="sp-name">底板类型</span>
    <div class="sp-radios">
      <label><input type="radio" name="floor-type" value="none"> 无</label>
      <label><input type="radio" name="floor-type" value="outline"> 轮廓</label>
      <label><input type="radio" name="floor-type" value="bbox"> 边界框</label>
      <label><input type="radio" name="floor-type" value="hull"> 凸包</label>
    </div>
    <span class="sp-desc">轮廓：各图形偏置后的外轮廓单独构成底板；边界框：所有轮廓的包围盒；凸包：所有轮廓的凸包</span>
  </div>
  <label class="sp-item">
    <span class="sp-name">底板厚度</span>
    <input id="sp-floor-thick" type="number" min="0.4" step="0.2" value="2"> mm
    <span class="sp-desc">底板轮廓的拉伸高度（与右侧全局参数·底板厚同步）</span>
  </label>
  <label class="sp-item">
    <span class="sp-name">底板外边距</span>
    <input id="sp-floor-margin" type="number" min="0" step="0.5" value="0"> mm
    <span class="sp-desc">得到底板轮廓后再执行的外偏置量（轮廓/边界框/凸包均生效）</span>
  </label>
</div>

<!-- Main Layout -->
<div id="main">

  <!-- Left Toolbar -->
  <aside id="left-bar">
    <div class="tool-group">
      <button class="tbtn active" data-tool="select" title="选择 (S)">🖱</button>
      <button class="tbtn" data-tool="rect" title="矩形">⬜</button>
      <button class="tbtn" data-tool="circle" title="圆形">⭕</button>
      <button class="tbtn" data-tool="polygon" title="正多边形">⬡</button>
      <button class="tbtn" data-tool="pen" title="钢笔 (P)">✏</button>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-group" id="userlib-list">
      <div class="lib-title">
        <span>用户图形</span>
        <button id="btn-lib-manage" type="button" aria-pressed="false" title="管理用户图形">管理</button>
      </div>
      <div id="lib-items"></div>
    </div>
  </aside>

  <!-- Center: 2D Editor + 3D Preview overlay -->
  <main id="canvas-area">
    <canvas id="editor-canvas"></canvas>

    <!-- 右侧浮动列: 3D 预览 (上) + SCAD 代码窗口 (下, 同边距, 高度占剩余) -->
    <div id="right-float-col">
      <div id="preview-window">
        <div class="pw-titlebar">
          <span id="pw-title-text">3D 预览</span>
          <button class="pw-btn" id="pw-swap" title="交换视图">↔</button>
          <button class="pw-btn" id="pw-collapse" title="折叠">▲</button>
        </div>
        <div class="pw-body">
          <canvas id="preview-canvas"></canvas>
          <div id="pw-placeholder">点击导出生成预览</div>
        </div>
      </div>

      <!-- SCAD 代码窗口 (左侧拉手调宽, 折叠后只显示标题栏) -->
      <div id="code-window">
        <div id="cw-resizer" title="拖拽调整宽度"></div>
        <div class="cw-titlebar">
          <span class="cw-title">SCAD 代码</span>
          <span id="cw-state" class="cw-hint">图形代码</span>
          <span class="spacer"></span>
          <button id="cw-preview" class="btn cw-btn" title="预览当前 SCAD 代码 (Ctrl+Enter)">预览</button>
          <button id="cw-copy" class="btn cw-btn" title="复制到剪贴板">复制</button>
          <button class="pw-btn" id="cw-collapse" title="折叠">▲</button>
        </div>
        <div class="cw-body">
          <textarea id="scad-editor"></textarea>
        </div>
      </div>
    </div>

    <!-- 照片矫正栏 (导入草图后显示) -->
    <div id="rectify-bar" class="float-bar" style="display:none">
      <label>矫正框
        <select id="rect-preset">
          <option value="a4" selected>A4 210×297</option>
          <option value="a5">A5 148×210</option>
          <option value="card">银行卡 85.6×54</option>
          <option value="custom">自定义</option>
          <option value="none">仅矫正·尺寸未知</option>
        </select>
      </label>
      <span id="rect-custom" style="display:none">
        <input id="rect-w" type="number" min="1" step="0.1" value="100"> ×
        <input id="rect-h" type="number" min="1" step="0.1" value="100"> mm
      </span>
      <label class="fb-check"><input type="checkbox" id="rect-ref-on"> 参考线</label>
      <input id="rect-ref-len" type="number" min="1" step="0.1" value="100" style="display:none">
      <span id="rect-ref-unit" style="display:none">mm</span>
      <button id="rect-apply" class="btn primary">✓ 应用矫正</button>
      <button id="rect-cancel" class="btn">✕ 取消</button>
      <span id="rect-hint" class="bar-hint"></span>
    </div>

    <!-- 草图控制栏 (应用矫正后显示) -->
    <div id="sketch-bar" class="float-bar" style="display:none">
      草图:
      <label class="fb-check" title="锁定后不响应拖动, 点击穿透到图形/钢笔"><input type="checkbox" id="sketch-lock" checked> 锁定</label>
      <label>X <input id="sketch-x" type="number" step="0.5"></label>
      <label>Y <input id="sketch-y" type="number" step="0.5"></label>
      <label>W <input id="sketch-w" type="number" step="0.5" min="1"></label>
      <label>H <input id="sketch-h" type="number" step="0.5" min="1"></label>
      <span>mm</span>
      <label>透明度 <input id="sketch-opacity" type="range" min="0.1" max="1" step="0.05" value="0.6"></label>
      <label class="fb-check"><input type="checkbox" id="sketch-visible" checked> 显示</label>
      <button id="sketch-rectify" class="btn">重新矫正</button>
      <button id="sketch-delete" class="btn">删除</button>
    </div>
  </main>

  <!-- Right Properties -->
  <aside id="right-panel">
    <div class="prop-section">
      <h4>图形属性</h4>
      <div id="prop-empty">选中图形以编辑属性</div>
      <div id="prop-content" style="display:none">
        <div class="prop-subtitle">中心位置</div>
        <label>X <input id="prop-x" type="number" step="0.1"> mm</label>
        <label>Y <input id="prop-y" type="number" step="0.1"> mm</label>
        <label id="prop-w-label">宽度 <input id="prop-w" type="number" step="0.1"> mm</label>
        <label id="prop-h-label">高度 <input id="prop-h" type="number" step="0.1"> mm</label>
        <label id="prop-corner-label">圆角 <input id="prop-corner" type="number" step="0.5" min="0"> mm</label>
        <label id="prop-dia-label">直径 <input id="prop-dia" type="number" step="0.1"> mm</label>
        <label id="prop-sides-label">边数 <input id="prop-sides" type="number" min="3" max="12"></label>
        <label id="prop-angle-label">旋转 <input id="prop-angle" type="number" step="1"> °</label>
        <label id="prop-height-label">拉伸高度 <input id="prop-height" type="number" step="0.5" min="1"> mm</label>
        <label id="prop-wall-label">壁厚 <input id="prop-wall" type="number" step="0.2" min="0.2"> mm</label>
        <div id="prop-verts-label" style="display:none">
          <div class="verts-title">顶点列表</div>
          <div id="prop-verts"></div>
        </div>
      </div>
    </div>
    <div class="prop-section">
      <h4>全局参数</h4>
      <label>壁厚 <input id="p-wall" type="range" min="0.8" max="8" value="2" step="0.2"><span id="v-wall">2.0</span>mm</label>
      <label>底板厚 <input id="p-bottom" type="range" min="0.4" max="10" value="2" step="0.2"><span id="v-bottom">2.0</span>mm</label>
      <label>高度 <input id="p-h" type="range" min="10" max="150" value="50" step="1"><span id="v-h">50</span>mm</label>
      <label>隔板高比 <input id="p-dr" type="range" min="0.3" max="1" value="0.9" step="0.05"><span id="v-dr">0.9</span></label>
    </div>
    <div class="prop-section">
      <h4>对象列表</h4>
      <div id="obj-list"></div>
    </div>
  </aside>
</div>

<!-- Status bar -->
<footer id="statusbar">
  <span id="status-text">就绪</span>
  <span id="status-wasm">服务连接中...</span>
</footer>

<!-- App modules (order matters) -->
<script src="js/model.js"></script>
<script src="js/scene.js"></script>
<script src="js/sketch.js"></script>
<script src="js/renderer.js"></script>
<script src="js/overlay.js"></script>
<script src="js/controller.js"></script>
<script src="js/preview.js"></script>
<script src="js/codeview.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
